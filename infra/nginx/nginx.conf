worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Section 39: compression, timeouts, connection handling.
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1024;

  # Mirrors apps/api's Fastify `bodyLimit: 1_048_576` (section 46 request
  # size limits) -- set slightly above it so Nginx never rejects a body
  # Fastify would have accepted, but still bounds worst-case memory use
  # per connection at the edge, before it reaches an API instance at all.
  client_max_body_size 2m;

  # Upstream reservation/payment requests can involve a Redis lock +
  # Postgres transaction; 10s is generous slack above the expected p99
  # while still failing a truly hung backend well before a client gives up.
  proxy_connect_timeout 5s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;

  # WebSocket upgrade support for /api/v1/events/:id/live. Without these
  # headers Nginx speaks plain HTTP/1.0 to the upstream and drops the
  # Upgrade handshake, so the live viewer count / live seat map could
  # never connect through this proxy (only when hitting api:4000 directly).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:4000;
  }

  # Phase 20: plain HTTP now exists ONLY to redirect to HTTPS -- apps/api's
  # session and CSRF cookies are both `Secure` when NODE_ENV=production
  # (which this whole docker-compose stack runs with, to test the real
  # production Dockerfiles), meaning a browser silently DROPS them over
  # plain HTTP. That's not hypothetical: it's exactly what Phase 20's own
  # login testing hit before this redirect existed. /health is the one
  # exception -- container/orchestration healthchecks have no reason to
  # negotiate TLS just to ask "are you up."
  server {
    listen 80;
    server_name _;

    location /health {
      proxy_pass http://api_upstream/health;
    }

    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name _;

    # LOCAL DEVELOPMENT SIMPLIFICATION: a self-signed cert
    # (generate-dev-cert.sh), which every browser will warn about
    # (correctly -- it's not issued by a trusted CA). Phase 21's AWS
    # deployment terminates TLS with a real ACM-issued certificate
    # instead, most likely at an Application Load Balancer rather than
    # Nginx itself -- this block demonstrates the TERMINATION MECHANISM,
    # not a preview of Phase 21's exact topology.
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Forward the real client IP and protocol. apps/api sets
    # `trustProxy: true` (apps/api/src/app.ts) specifically so it reads
    # these headers instead of seeing Nginx's own IP as the client --
    # section 20's rate limiter is keyed by client IP, and without this
    # pairing every request would appear to originate from Nginx itself,
    # silently collapsing every user into one shared rate-limit bucket.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API routes are NOT prefix-stripped: apps/api's own routes already
    # live under /api/v1 (section 32), so Nginx just forwards /api/* as-is.
    # Live WebSocket endpoint: HTTP/1.1 + Upgrade headers, and a long read
    # timeout -- an idle socket between viewer-count/seat updates is
    # normal and must not be cut off after the 10s REST timeout above.
    location ~ ^/api/v1/events/[^/]+/live$ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location /api/ {
      proxy_pass http://api_upstream;
    }

    location /health {
      proxy_pass http://api_upstream/health;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
